apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def getDropboxToken() {
    Properties properties = new Properties()
    File settingsFile = project.rootProject.file('settings.properties')
    if (settingsFile.exists()) {
        properties.load(settingsFile.newDataInputStream())
        return properties.getProperty("dropbox_token", "");
    }
    return "";
}

android {
    namespace 'com.kristurek.polskatv'

    signingConfigs {
        config {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    compileSdk 37

    defaultConfig {
        applicationId "com.kristurek.polskatv"
        minSdk 23
        targetSdk 35
        versionCode 119
        versionName "119"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "String", "DROPBOX_TOKEN", "\"" + getDropboxToken() + "\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            signingConfig signingConfigs.config
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        test {
            resources.srcDirs += ["src/test/resources"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        checkDependencies false
        ignoreTestSources true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("polskatv-${android.defaultConfig.versionCode}.apk")
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.4.0'

    implementation 'joda-time:joda-time:2.14.2'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'com.dropbox.core:dropbox-core-sdk:7.0.0'
    api 'com.google.guava:guava:33.6.0-android'  //remember - android, not jre

    annotationProcessor 'com.google.dagger:dagger-compiler:2.60'
    implementation 'com.google.dagger:dagger:2.60'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'com.squareup.retrofit2:retrofit-mock:3.0.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.4.0'
    testImplementation 'org.hamcrest:hamcrest-library:3.0'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-common:1.10.1'
    implementation 'androidx.media3:media3-datasource:1.10.1'

    implementation 'com.google.android.material:material:1.14.0'
}
