# Android
# Build your Android project with Gradle and upload to Dropbox.

trigger:
  tags:
    include:
    - v*

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: DownloadSecureFile@1
  name: polskatv
  displayName: 'Download polskatv.jks'
  inputs:
    secureFile: 'polskatv.jks'

- task: DownloadSecureFile@1
  name: keystore
  displayName: 'Download keystore.properties'
  inputs:
    secureFile: 'keystore.properties'

- task: DownloadSecureFile@1
  name: settings
  displayName: 'Download settings.properties'
  inputs:
    secureFile: 'settings.properties'

- task: Bash@3
  displayName: 'Prepare Configuration Files'
  inputs:
    targetType: 'inline'
    script: |
      cp $(keystore.secureFilePath) $(Build.SourcesDirectory)/keystore.properties
      cp $(settings.secureFilePath) $(Build.SourcesDirectory)/settings.properties
      cp $(polskatv.secureFilePath) $(Build.SourcesDirectory)/polskatv.jks
      ls -all

- task: Gradle@3
  displayName: 'Build APK'
  inputs:
    workingDirectory: ''
    gradleWrapperFile: 'gradlew'
    gradleOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '17'
    publishJUnitResults: false
    tasks: 'assembleRelease'

- task: CopyFiles@2
  displayName: 'Copy APK to Staging'
  inputs:
    contents: 'app/build/outputs/apk/release/*.apk'
    targetFolder: $(Build.ArtifactStagingDirectory)
    flattenFolders: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifacts'
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)
    artifactName: MyBuildOutputs

- task: Bash@3
  displayName: 'Upload to Dropbox'
  inputs:
    targetType: 'inline'
    script: |
      set -e
      
      SETTINGS_FILE="$(Build.SourcesDirectory)/settings.properties"
      
      echo "Extracting credentials from settings.properties..."
      APP_KEY=$(grep 'dropbox_app_key=' $SETTINGS_FILE | cut -d'=' -f2 | tr -d '\r')
      APP_SECRET=$(grep 'dropbox_app_secret=' $SETTINGS_FILE | cut -d'=' -f2 | tr -d '\r')
      REFRESH_TOKEN=$(grep 'dropbox_refresh_token=' $SETTINGS_FILE | cut -d'=' -f2 | tr -d '\r')

      if [ -z "$APP_KEY" ] || [ -z "$APP_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
        echo "Error: One or more Dropbox credentials missing in settings.properties"
        exit 1
      fi

      echo "Refreshing Dropbox access token..."
      
      RESPONSE=$(curl -s -X POST https://api.dropbox.com/oauth2/token \
        -d grant_type=refresh_token \
        -d refresh_token="$REFRESH_TOKEN" \
        -d client_id="$APP_KEY" \
        -d client_secret="$APP_SECRET")
      
      ACCESS_TOKEN=$(echo $RESPONSE | sed -n 's/.*"access_token": *"\([^"]*\)".*/\1/p')
      
      if [ -z "$ACCESS_TOKEN" ]; then
        echo "Error: Failed to obtain access token"
        echo "Full response: $RESPONSE"
        exit 1
      fi

      echo "Uploading APK files to Dropbox..."
      for file in $(Build.ArtifactStagingDirectory)/*.apk; do
          FILENAME=$(basename "$file")
          echo "Uploading $FILENAME..."
          curl -X POST https://content.dropboxapi.com/2/files/upload \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            --header "Dropbox-API-Arg: {\"path\": \"/apk/$FILENAME\",\"mode\": \"add\",\"autorename\": true,\"mute\": false}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$file"
          echo -e "\nFinished uploading $FILENAME"
      done
